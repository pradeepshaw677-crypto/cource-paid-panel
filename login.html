<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Smart Tech</title>

    <!-- ── SECURITY HEADERS ─────────────────────────────────────── -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com wss://*.firebaseio.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/styles.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Poppins', 'sans-serif'], },
                    colors: { brandBlue: '#0f4c81', brandGold: '#f59e0b', adminDark: '#0f172a' }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-adminDark p-4">

    <div class="w-full max-w-sm">
        <div class="text-center mb-6">
            <div class="w-16 h-16 bg-brandGold rounded-2xl flex items-center justify-center text-adminDark font-black text-3xl mx-auto mb-3 shadow-lg">ST</div>
            <h1 class="text-white font-bold text-xl">Admin Login</h1>
            <p class="text-gray-400 text-[11px] uppercase tracking-widest mt-1">Smart Tech Panel</p>
        </div>

        <div class="bg-white rounded-3xl shadow-2xl p-6">
            <form id="login-form" class="space-y-4" autocomplete="off">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Admin Email</label>
                    <input type="email" id="login-email" required autocomplete="username"
                        class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm font-bold text-gray-800 outline-none focus:border-brandBlue"
                        placeholder="admin@example.com">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 uppercase tracking-wider mb-1">Password</label>
                    <input type="password" id="login-password" required autocomplete="current-password"
                        class="w-full bg-gray-50 border border-gray-200 p-3 rounded-xl text-sm font-bold text-gray-800 outline-none focus:border-brandBlue"
                        placeholder="••••••••">
                </div>

                <p id="login-error" class="text-red-500 text-xs font-bold min-h-[16px]"></p>

                <button type="submit" id="login-btn"
                    class="w-full bg-brandBlue hover:bg-blue-800 text-white font-bold py-3.5 rounded-xl shadow-lg transition text-sm flex justify-center items-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Login
                </button>
            </form>
        </div>

        <p class="text-center text-gray-500 text-[10px] mt-5"><i class="fa-solid fa-lock mr-1"></i> Secured with Firebase Authentication</p>
    </div>

    <script type="module" src="./js/login.js"></script>
</body>
</html>
